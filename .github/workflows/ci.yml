name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Lancer les tests
        run: python -m pytest -v

  semgrep:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer Semgrep
        run: pip install semgrep

      - name: Scan SAST (bloquant sur les résultats ERROR)
        # --severity ERROR : seuls les résultats critiques sont remontés
        # --error         : le job échoue (code 1) s'il en reste au moins un
        run: |
          semgrep scan \
            --config p/default \
            --config p/python \
            --config .semgrep/taskflow-sql-injection.yml \
            --severity ERROR \
            --error \
            app/

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code avec tout l'historique
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # par défaut, seul le dernier commit est récupéré

      - name: Installer Gitleaks
        run: |
          wget -q https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz
          tar -xzf gitleaks_8.24.3_linux_x64.tar.gz gitleaks

      - name: Scan des secrets sur tout l'historique (bloquant)
        # .gitleaksignore est lu automatiquement : seules les exceptions justifiées sont ignorées
        run: ./gitleaks git . --redact -v --exit-code 1
