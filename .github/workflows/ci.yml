name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Lancer les tests
        run: python -m pytest -v

  semgrep:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer Semgrep
        run: pip install semgrep

      - name: Scan SAST (bloquant sur les résultats ERROR)
        # --severity ERROR : seuls les résultats critiques sont remontés
        # --error         : le job échoue (code 1) s'il en reste au moins un
        run: |
          semgrep scan \
            --config p/default \
            --config p/python \
            --config .semgrep/ \
            --severity ERROR \
            --error \
            app/

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code avec tout l'historique
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # par défaut, seul le dernier commit est récupéré

      - name: Installer Gitleaks
        run: |
          wget -q https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz
          tar -xzf gitleaks_8.24.3_linux_x64.tar.gz gitleaks

      - name: Scan des secrets sur tout l'historique (bloquant)
        # .gitleaksignore est lu automatiquement : seules les exceptions justifiées sont ignorées
        run: ./gitleaks git . --redact -v --exit-code 1

  trivy:
    runs-on: ubuntu-latest
    env:
      # Miroir officiel de la base de vulnérabilités (évite les limites de téléchargement)
      TRIVY_DB_REPOSITORY: public.ecr.aws/aquasecurity/trivy-db
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Trivy (dépôt officiel Aqua Security)
        run: |
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | gpg --dearmor | sudo tee /usr/share/keyrings/trivy.gpg > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb generic main" | sudo tee /etc/apt/sources.list.d/trivy.list
          sudo apt-get update -qq && sudo apt-get install -y -qq trivy
          trivy --version

      # Seuils de SECURITY.md § 3 : CRITICAL et HIGH avec correctif disponible = bloquant.
      # Les exceptions datées de .trivyignore sont lues automatiquement.
      - name: Scan des dépendances (bloquant)
        run: trivy fs --scanners vuln --severity CRITICAL,HIGH --ignore-unfixed --exit-code 1 requirements.txt

      - name: Construire l'image
        run: docker build -t taskflow:ci .

      - name: Scan de l'image (bloquant)
        run: trivy image --scanners vuln --severity CRITICAL,HIGH --ignore-unfixed --exit-code 1 taskflow:ci
  
  checkov:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer Checkov
        run: pip install checkov==3.4.10

      - name: Scan Terraform (bloquant)
        run: checkov -d infra/ --framework terraform --compact --quiet

      - name: Scan Kubernetes (bloquant)
        run: checkov -d k8s/ --framework kubernetes --compact --quiet

      - name: Scan du chart Helm (bloquant)
        run: checkov -d charts/taskflow --framework helm --compact --quiet

  dast-sbom:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Construire l'image
        run: docker build -t taskflow:ci .

      - name: Lancer l'application dans le job
        run: |
          docker run -d --name taskflow -p 8085:8085 taskflow:ci
          # Attend que l'API réponde (30 s maximum)
          for i in $(seq 1 30); do
            curl -sf http://localhost:8085/health && exit 0
            sleep 1
          done
          echo "L'application n'a pas démarré" && docker logs taskflow && exit 1

      - name: Scan DAST (ZAP baseline)
        # -I : les alertes de niveau WARN ne font pas échouer le job (rapport archivé et analysé)
        run: |
          mkdir -p zap && chmod 777 zap
          docker run --rm --network host -v "$PWD/zap:/zap/wrk:rw" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py -t http://localhost:8085 -r zap-baseline.html -J zap-baseline.json -I

      - name: Générer le SBOM (Syft, CycloneDX)
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sudo sh -s -- -b /usr/local/bin
          syft taskflow:ci -o cyclonedx-json=sbom-taskflow.cdx.json

      - name: Archiver le rapport ZAP
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapport-zap
          path: zap/

      - name: Archiver le SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom-cyclonedx
          path: sbom-taskflow.cdx.json
