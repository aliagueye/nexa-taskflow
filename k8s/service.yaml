apiVersion: v1
kind: Service
metadata:
  name: taskflow
  annotations:
    checkov.io/skip1: CKV_K8S_21=Gouvernance - namespace dedie a creer lors du deploiement, échéance 2027-02-23
spec:
  # TP4 étape 5 - Exposition : service interne au cluster (au lieu d'un LoadBalancer public).
  # L'exposition externe passera par un Ingress avec TLS.
  type: ClusterIP
  selector:
    app: taskflow
  ports:
    - port: 80
      targetPort: 8085
