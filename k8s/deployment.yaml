apiVersion: apps/v1
kind: Deployment
metadata:
  name: taskflow
  labels:
    app: taskflow
  # TP4 étape 5 - Exceptions Checkov justifiées (échéance 2027-02-23)
  annotations:
    checkov.io/skip1: CKV_K8S_8=Disponibilite - liveness probe sur /health a ajouter, échéance 2027-02-23
    checkov.io/skip2: CKV_K8S_9=Disponibilite - readiness probe sur /health a ajouter, échéance 2027-02-23
    checkov.io/skip3: CKV_K8S_43=Integrite - epinglage par digest une fois l'image publiee dans le registre, échéance 2027-02-23
    checkov.io/skip4: CKV_K8S_15=Maintenance - tag fixe 1.0.0 donc pull IfNotPresent suffisant, échéance 2027-02-23
    checkov.io/skip5: CKV_K8S_21=Gouvernance - namespace dedie a creer lors du deploiement, échéance 2027-02-23
spec:
  replicas: 2
  selector:
    matchLabels:
      app: taskflow
  template:
    metadata:
      labels:
        app: taskflow
    spec:
      # TP4 étape 5 - Secret : pas de jeton d'accès à l'API Kubernetes monté dans le pod
      automountServiceAccountToken: false
      # TP4 - securityContext du pod : non-root, profil seccomp par défaut
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: nexa/taskflow:1.0.0 # TP4 - Image versionnée (au lieu de :latest)
          ports:
            - containerPort: 8085
          # TP4 - securityContext du conteneur (au lieu de privileged: true)
          securityContext:
            privileged: false
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          # TP4 - Limites de ressources
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          env:
            - name: TASKFLOW_DB
              value: /data/taskflow.db
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          hostPath:
            path: /var/taskflow
