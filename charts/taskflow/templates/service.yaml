apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-taskflow
  annotations:
    checkov.io/skip1: CKV_K8S_21=Gouvernance - namespace fourni par helm install --namespace, échéance 2027-02-23
spec:
  type: {{ .Values.service.type }}
  selector:
    app: {{ .Release.Name }}-taskflow
  ports:
    - port: {{ .Values.service.port }}
      targetPort: 8085
